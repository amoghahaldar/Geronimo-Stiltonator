<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibberishmo Stiltonator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        h1 {
            margin: 0;
        }
        main {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gibberishmo Stiltonator</h1>
    </header>
    <main>
        <div style="font-size: 30px; color: lightblue;">
            <div style="margin-left: 0px;">Hello</div>
            <div style="margin-left: 10px;">Hello</div>
            <div style="margin-left: 20px;">Hello</div>
            <div style="margin-left: 30px;">Hello</div>
            <div style="margin-left: 40px;">Hello</div>
        </div>
        <p>explain what it does!@UIRF#)(RU#*)!</p>
        <label for="inputText">Input text to stiltonify!</label>
        <textarea id="inputText" rows="4" cols="50" placeholder="Type your text here..."></textarea>
        <button id="goButton">Go</button>
        <div id="output" style="margin-top: 20px;"></div>

        <script>
            document.getElementById('goButton').addEventListener('click', function() {
            const inputText = document.getElementById('inputText').value;
            const words = inputText.split(' ');
            const styledWords = words.map(word => {
                return word.startsWith('b') || word.startsWith('B') ? `<span style="color: pink;">${word}</span>` : word;
            });
            document.getElementById('output').innerHTML = styledWords.join(' ');
            });
        </script>
        
            
        </script>
    </main>
</body>
</html>
